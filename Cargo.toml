[package]
name = "file_transfer"
version = "0.1.0"
edition = "2021"
authors = ["Computer Networks Student"]
description = "Reliable File Transfer Protocol over UDP with GUI and Benchmark Mode"

[dependencies]
# GUI Framework
eframe = { version = "0.30", default-features = true }
rfd = "0.15"

# Cryptographic and Integrity hashing
sha2 = "0.10"
crc32fast = "1.4"

# CLI parsing
clap = { version = "4.5", features = ["derive"] }

# Concurrency & Channels
crossbeam-channel = "0.5"

# Random (for simulated packet loss in evaluation)
rand = "0.8"

# Optional local IP resolution
local-ip-address = "0.6"

# Tempfile for benchmark test files
tempfile = "3.16"
